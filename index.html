<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:wght@700;800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>
  <section id="mainContainer">
    <header>
      <h1>Áurea</h1>
      <h2>Energia que nasce do sol. Futuro que cresce com você.</h2>
    </header>
    <div id="loginContainer">
      <form id="loginForm">
        <div>
          <label for="emailInputLogin">Email</label>
          <input type="email" name="email" id="emailInputLogin">
        </div>
        
        <div>
          <label for="passwordInputLogin">Senha</label>
          <input type="password" id="passwordInputLogin">
        </div>

        <input type="button" value="Login">
      </form>
      <span class="toggleSpan">Não tem uma conta? Clique aqui para cadastrar</span>
    </div>
    <div id="registerContainer" class="hidden">
      <form id="registerForm">
        <div>
          <label for="nameInput">Nome</label>
          <input type="text" id="nameInput">
        </div>

        <div>
          <label for="ageInput">Idade</label>
          <input type="number" id="ageInput">
        </div>
        
        <div>
          <label for="emailInput">Email</label>
          <input type="email" name="email" id="emailInput">
        </div>
        
        <div>
          <label for="passwordInput">Senha</label>
          <input type="password" name="password" id="passwordInput">
        </div>
        
        <div>
          <label for="passwordConfirmInput">Confirmar senha</label>
          <input type="password" name="passwordConfirm" id="passwordConfirmInput">
        </div>
        <input type="button" value="Cadastrar">
      </form>
      <span class="toggleSpan">Já tem uma conta? Clique aqui para fazer login</span>
    </div>
  </section>
</body>
</html>
